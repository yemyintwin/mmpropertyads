name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect backend solution
        id: backend
        shell: bash
        run: |
          if [[ -f backend/PropertyAds.sln ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@v4
        if: steps.backend.outputs.present == 'true'
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
      - run: dotnet build --no-restore -c Release
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
      - run: dotnet test --no-build -c Release
        if: steps.backend.outputs.present == 'true'
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

# Deployment workflows (staging on main, production on approval) are added once
# the Azure resources exist (see infra/ and docs/architecture.md).
