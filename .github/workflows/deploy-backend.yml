name: Deploy Azure Functions API

on:
  push:
    branches: [main]
    paths:
      - "backend/src/PropertyAds.Api/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.AZURE_FUNCTIONAPP_NAME != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish API
        run: dotnet publish backend/src/PropertyAds.Api/PropertyAds.Api.csproj --configuration Release --output ./backend-publish
      - name: Validate publish profile
        shell: bash
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          if [[ -z "$PUBLISH_PROFILE" ]]; then
            echo "::error::Set the AZURE_FUNCTIONAPP_PUBLISH_PROFILE repository secret before deploying."
            exit 1
          fi
      - name: Deploy API
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ./backend-publish
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
